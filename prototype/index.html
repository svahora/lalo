<style>
/* Layout: a simulated Mac desktop. Only the menu bar is live at load; the spark opens a popover, the popover opens the board window. */
:root{
  --wall:#cfd5dc; --wall-dot:rgba(22,28,38,.07); --wall-ink:rgba(22,28,38,.34);
  --bar:rgba(244,246,248,.86); --bar-fg:#16181d;
  --panel:#fcfcfd; --panel-2:#f2f3f6; --panel-3:#e9ebef; --line:#e1e4ea; --line-strong:#c9cdd5;
  --fg:#15171c; --fg-2:#565c68; --fg-3:#8a909b;
  --accent:#5a3bea; --accent-bg:#ece8fd; --accent-ink:#3b22b0;
  --hot:#c2412d; --hot-bg:#fde8e3; --switch-on:#2f9e55;
  --ai:#2458c4; --ai-bg:#e5edfd; --help:#6f45c9; --help-bg:#efe8fd; --ok:#2b7d47; --ok-bg:#e1f2e6;
  --shadow:0 24px 60px rgba(14,18,28,.24),0 2px 8px rgba(14,18,28,.12);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#1a1d23; --wall-dot:rgba(235,240,250,.06); --wall-ink:rgba(235,240,250,.32);
  --bar:rgba(30,33,39,.86); --bar-fg:#eceef2;
  --panel:#212429; --panel-2:#292d34; --panel-3:#323741; --line:#353a44; --line-strong:#4a505c;
  --fg:#eceef2; --fg-2:#a6acb8; --fg-3:#757b87;
  --accent:#7158f5; --accent-bg:#27214d; --accent-ink:#b9adff;
  --hot:#ff8a70; --hot-bg:#3d1d16;
  --ai:#8ab0ff; --ai-bg:#1c2a45; --help:#b9a0ff; --help-bg:#2b2346; --ok:#74d197; --ok-bg:#1a3223;
  --shadow:0 24px 60px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#1a1d23; --wall-dot:rgba(235,240,250,.06); --wall-ink:rgba(235,240,250,.32);
  --bar:rgba(30,33,39,.86); --bar-fg:#eceef2;
  --panel:#212429; --panel-2:#292d34; --panel-3:#323741; --line:#353a44; --line-strong:#4a505c;
  --fg:#eceef2; --fg-2:#a6acb8; --fg-3:#757b87;
  --accent:#7158f5; --accent-bg:#27214d; --accent-ink:#b9adff;
  --hot:#ff8a70; --hot-bg:#3d1d16;
  --ai:#8ab0ff; --ai-bg:#1c2a45; --help:#b9a0ff; --help-bg:#2b2346; --ok:#74d197; --ok-bg:#1a3223;
  --shadow:0 24px 60px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--wall);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.desk{position:relative;height:100%;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1px,transparent 1.2px);background-size:22px 22px}

/* menu bar */
.bar{position:relative;z-index:30;height:30px;display:flex;align-items:center;gap:16px;background:var(--bar);color:var(--bar-fg);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
.bar .menus{display:flex;gap:16px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.bar .menus b{font-weight:600}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.bar svg{width:16px;height:16px;display:block}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bar-fg);opacity:.85}
.spark{position:relative;display:flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;border:0;background:transparent}
.spark:hover,.spark[aria-expanded="true"]{background:var(--panel-3)}
.spark .n{font-family:var(--mono);font-size:12px;font-weight:500;min-width:8px}
.spark .pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bar)}
.spark .glyph{color:var(--accent)}
.clock{font-variant-numeric:tabular-nums}

/* first-load hint */
.hint{position:absolute;z-index:25;top:40px;right:max(70px,calc(env(safe-area-inset-right,0px) + 70px));background:var(--fg);color:var(--panel);
  padding:8px 12px;border-radius:10px;font-size:13px;max-width:240px;animation:bob 2.4s ease-in-out infinite}
.hint::before{content:"";position:absolute;top:-6px;right:22px;width:12px;height:12px;background:var(--fg);transform:rotate(45deg);border-radius:2px}
.hint kbd{white-space:nowrap;font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;background:rgba(127,127,127,.3)}
@keyframes bob{50%{transform:translateY(3px)}}
.wordmark{position:absolute;inset:auto 0 12% 0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(64px,14vw,168px);
  letter-spacing:-.04em;color:var(--wall-ink);opacity:.5;pointer-events:none;user-select:none;line-height:1}
.wordmark small{display:block;font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;margin-top:10px;opacity:1}

/* popover */
.pop{position:absolute;z-index:40;top:36px;right:max(8px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 16px));background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transform-origin:top right}
.pop.anim{animation:pop .16s ease-out}
.pop{max-height:calc(100% - 44px);overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}
.cap{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.cap input{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--fg);padding:0 12px;font:inherit}
.cap input::placeholder{color:var(--fg-3)}
.iconbtn{width:38px;height:38px;flex:none;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px}
.iconbtn.go{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.caphelp{padding:6px 14px 0;font-size:12px;color:var(--fg-3)}
.err{color:#c2412d;font-size:12px;padding:6px 14px 0}
.sec{padding:10px 6px 4px}
.sec h3{margin:0 8px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px}
.row:hover{background:var(--panel-2)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--fg-2);white-space:nowrap;max-width:42%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mark{width:8px;height:8px;border-radius:50%;flex:none}
.mark.need{background:var(--accent)} .mark.work{border:2px solid var(--ai);border-right-color:transparent;width:10px;height:10px;animation:spin 1s linear infinite} .mark.done{background:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.popfoot{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);margin-top:6px}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.btn.pri:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn svg{width:15px;height:15px}
.grow{flex:1}

/* window */
.win{position:absolute;z-index:20;left:50%;top:52px;transform:translateX(-50%);width:min(1080px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));
  height:calc(100% - 72px);max-height:720px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:184px minmax(0,1fr);overflow:hidden}
.win.anim{animation:pop .18s ease-out}
.side{background:var(--panel-2);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.lights{display:flex;gap:7px;padding:2px 4px 14px}
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0}
.lights .c{background:#ec6a5e}.lights .m{background:#f4bf4f}.lights .z{background:#61c554}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.03em;padding:0 8px 12px;display:flex;align-items:center;gap:6px}
.brand svg{width:18px;height:18px;color:var(--accent)}
.nav{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:7px 8px;border-radius:7px;text-align:left;color:var(--fg-2)}
.nav[aria-current="page"]{background:var(--panel-3);color:var(--fg);font-weight:500}
.nav svg{width:16px;height:16px}
.nav .c{margin-left:auto;font-family:var(--mono);font-size:11px}
.sidefoot{margin-top:auto;font-size:11px;color:var(--fg-3);padding:8px;line-height:1.5}
.main{position:relative;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.mainhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mainhead h1{margin:0;font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.02em}
.mainhead .sub{color:var(--fg-3);font-size:13px}
.menu-btn{display:none}

.board{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;padding:16px 18px}
.col{background:var(--panel-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;align-self:start}
.col h2{margin:2px 4px 2px;font-size:12px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:7px}
.col h2 .c{margin-left:auto;font-family:var(--mono);font-weight:400;color:var(--fg-3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:7px;width:100%}
.card:hover{border-color:var(--line-strong)}
.card[aria-current="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.card.need{border-left:3px solid var(--accent);border-radius:0 10px 10px 0}
.card .src{font-size:11px;color:var(--fg-3);display:flex;gap:6px;align-items:center}
.card .ttl{font-weight:500;line-height:1.35}
.bar-p{height:4px;border-radius:2px;background:var(--panel-3);overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--ai);transition:width .4s}
.empty{font-size:12px;color:var(--fg-3);padding:10px 6px;text-align:center}

.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap;align-self:flex-start}
.tag.ai{background:var(--ai-bg);color:var(--ai)} .tag.help{background:var(--help-bg);color:var(--help)}
.tag.you{background:var(--accent-bg);color:var(--accent-ink)} .tag.ok{background:var(--ok-bg);color:var(--ok)}

/* detail drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  box-shadow:-16px 0 40px rgba(0,0,0,.08);z-index:5}
.drawer.anim{animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dhead{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dhead h2{margin:4px 0 0;font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.dbody{flex:1;overflow:auto;padding:4px 18px 18px}
.dsec{margin-top:16px}
.dsec>h3{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .ic{width:18px;height:18px;flex:none;margin-top:1px;display:grid;place-items:center}
.step .ic svg{width:17px;height:17px}
.step .tx{flex:1;min-width:0}
.step .tx small{display:block;color:var(--fg-2);font-size:12px;margin-top:1px}
.step.done .tx>span{color:var(--fg-2)}
.ring{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
.ring.doing{border-color:var(--ai);border-right-color:transparent;animation:spin 1s linear infinite}
.q{margin:12px 0 6px;font-size:13px;color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.ctx{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--fg-2)}
.ctx b{color:var(--fg);font-weight:500}
.draft{border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;background:var(--panel)}
.draft.flash{animation:flash .6s ease-out}
@keyframes flash{from{background:var(--accent-bg)}}
.commit{font-size:12px;color:var(--accent-ink);background:var(--accent-bg);border-radius:8px;padding:6px 10px;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.msg{max-width:88%;padding:7px 11px;border-radius:12px;font-size:13px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--panel);border-bottom-right-radius:4px}
.msg.lalo{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:4px}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin input{flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--fg);padding:0 12px;font:inherit}
.li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.li:first-of-type{border-top:0}
.li .from{font-size:11px;color:var(--fg-3);white-space:nowrap;font-family:var(--mono)}
.tip{background:var(--accent-bg);color:var(--accent-ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.rep{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg-2);font-weight:500}
.rep svg{width:13px;height:13px;color:var(--ai)}
.rep.off svg{color:var(--fg-3)}
.sched{border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;background:var(--panel-2)}
.sched-top{display:flex;gap:10px;align-items:flex-start}
.sched-top svg{width:20px;height:20px;color:var(--ai);flex:none;margin-top:1px}
.sched.off .sched-top svg{color:var(--fg-3)}
.sched b{font-weight:600}
.sched small{display:block;color:var(--fg-2);font-size:12px}
.ready{display:flex;gap:10px;align-items:flex-start;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px}
.ready svg{width:18px;height:18px;flex:none;margin-top:1px}
.ready b{font-weight:600}
.ready small{display:block;color:var(--fg-2);font-size:12px}
.shots{display:grid;grid-template-columns:1.6fr 1.6fr 1fr 1fr;gap:8px;align-items:end}
.shot{margin:0;min-width:0}
.shot figcaption{font-size:11px;color:var(--fg-3);margin-top:4px}
.frame{border:1px solid var(--line-strong);border-radius:8px;background:var(--panel-2);padding:8px;display:flex;flex-direction:column;gap:5px}
.shot.m .frame{border-radius:10px;padding:8px 6px}
.frame .ln{height:6px;border-radius:3px;background:var(--panel-3)}
.frame .w60{width:60%}.frame .w80{width:80%}
.frame .tog{display:flex;align-items:center;gap:4px;font-size:9px;line-height:1.2;color:var(--fg);background:var(--accent-bg);border-radius:4px;padding:3px}
.frame .sw{width:14px;height:8px;border-radius:4px;background:var(--ai);flex:none}
.frame .cta{font-size:9px;text-align:center;background:var(--fg);color:var(--panel);border-radius:4px;padding:3px 2px;white-space:nowrap;overflow:hidden}
@media (max-width:520px){.shots{grid-template-columns:1fr 1fr}}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--fg-3)}
.type{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--fg-2)}
.type svg{width:13px;height:13px}
.prio{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:auto}
.prio.p1{background:var(--hot-bg);color:var(--hot)} .prio.p2{background:var(--accent-bg);color:var(--accent-ink)} .prio.p3{background:var(--panel-3);color:var(--fg-2)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.filters .chip{height:28px;display:inline-flex;align-items:center;gap:5px;font-size:12px}
.filters .chip svg{width:13px;height:13px}
.filters .chip .n{font-family:var(--mono);color:var(--fg-3)}
.filters .chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.why{font-size:12px;color:var(--fg-2);margin-top:6px}
@media (max-width:760px){.filters{padding:10px 16px 0}}
.popfoot{flex-wrap:wrap}
.popfoot .btn{flex:1;justify-content:center}
.recpill{display:none;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;border:0;background:var(--hot-bg);color:var(--hot);font-family:var(--mono);font-size:12px;font-weight:500}
.recpill.on{display:inline-flex}
.recdot{width:8px;height:8px;border-radius:50%;background:var(--hot);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.meet{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr)}
.mlist{border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
.mitem{border:0;background:transparent;text-align:left;border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;width:100%}
.mitem:hover{background:var(--panel-2)}
.mitem[aria-current="true"]{background:var(--panel-3)}
.mitem b{font-weight:500}
.mitem small{color:var(--fg-3);font-size:12px;display:flex;gap:6px;align-items:center}

const TYPES = { build:['Build','code'], reply:['Reply','chat'], prep:['Meeting prep','cal'], errand:['Errand','bag'], plan:['Planning','list'], routine:['Routine','repeat'], task:['Task','dot'] };
const PRI = {1:'Now', 2:'Next', 3:'Later'};
function typeOf(k){
  if(k.type) return k.type;
  if(k.repeat) return 'routine';
  return {ship:'build', draft:'reply', prep:'prep', stove:'errand', tickets:'plan', summary:'routine'}[k.kind] || 'task';
}
const SEED_PRI = {
  c7:[1,'Product change for the Q4 checkout goal. Your rule: product changes before Slack replies'],
  c2:[2,'Jordan is waiting on you to confirm a date'],
  c4:[2,'The 1:1 is Tuesday'],
  c3:[2,'Needs to be in before the next tenant'],
  c1:[3,'No deadline, and Theo already gave feedback'],
  c5:[3,'Tickets can wait for Monday planning'],
  c6:[3,'Runs on its own every Friday']
};
cards.forEach(k=>{ const p=SEED_PRI[k.id]; if(p){ k.pri=p[0]; k.why=p[1]; } });
const byPri = (a,b) => (a.pri||2) - (b.pri||2);
function guessType(t){
  const s=t.toLowerCase();
  if(/\b(reply|respond|answer|get back to)\b/.test(s)) return 'reply';
  if(/\b(fix|build|ship|bug|code|deploy|implement|add .* to)\b/.test(s)) return 'build';
  if(/\b(1:1|meeting|prep|call with)\b/.test(s)) return 'prep';
  if(/\b(buy|order|purchase|book|return)\b/.test(s)) return 'errand';
  if(/\b(ticket|plan|roadmap|scope)\b/.test(s)) return 'plan';
  return 'task';
}

function counts(){ const c={need:0,work:0,done:0}; cards.forEach(k=>c[k.col]++); return c; }
function progress(k){ if(!k.steps) return null; const d=k.steps.filter(s=>s.st==='done').length; return {d, n:k.steps.length}; }
function status(k){
  if(k.col==='done' && k.repeat) return k.repeat.paused ? 'Paused' : 'Next run '+k.repeat.next;
  if(k.col==='done') return k.kind==='ship' ? 'Sent to engineering' : 'Done';
  if(k.col==='need' && k.kind==='ship') return 'Ready for your review';
  if(k.kind==='draft') return 'Draft ready';
  if(k.kind==='stove' && k.qs.some(q=>!q.a)) { const n=k.qs.filter(q=>!q.a).length; return n+(n>1?' questions':' question'); }
  if(k.col==='need'){
    if(k.kind==='prep') return 'Brief ready';
    if(k.kind==='tickets') return '4 tickets to review';
    if(k.kind==='stove') return '3 options to pick from';
    return 'Plan ready';
  }
  const doing = k.steps && k.steps.find(s=>s.st==='doing');
  return doing ? doing.t : 'Planning steps';
}

const CAP = 4;
function capped(key, items, renderItem, emptyHTML){
  if(!items.length) return emptyHTML || '';

  return shown.map(renderItem).join('') + (items.length > CAP ? `<button class="more" data-more="${key}">${all ? 'Show less' : 'Show all '+items.length}</button>` : '');
}

function cuApprove(k){
  if(k.kind==='stove'){ ui.view='board'; ui.sel=k.id; render(); toast('Answer the 3 questions to keep it moving.'); return false; }
  if(k.kind==='ship'){ const y=k.steps.findIndex(s=>s.who==='you'); k.steps[y].st='done'; k.steps[y+1].st='doing'; k.col='work'; toast('Approved. Sending to engineering.'); return true; }
  if(k.kind==='draft'){ k.col='done'; toast('Approved. Draft copied and marked sent.'); try{ navigator.clipboard.writeText(k.draft.v[k.draft.cur]).catch(()=>{}); }catch(_){} return true; }
  if(k.kind==='tickets'){ k.col='done'; k.steps.forEach(x=>x.st='done'); toast('Created 4 tickets.'); return true; }
  k.col='done'; if(k.steps) k.steps.forEach(x=>x.st='done'); toast('Done.'); return true;

function cuDecide(dir){
  const el=document.getElementById('cqTop'); const id=ui.cq && ui.cq[0]; if(!id) return;
  const k=cards.find(x=>x.id===id);
  const finish=()=>{
    ui.dragging=false;
    if(dir>0){ ui.cq.shift(); const ok=cuApprove(k); if(ok===false) return; ui.cqDone++; }
    else { ui.cq.shift(); ui.cqLater++; toast('Kept for later. It stays in Needs you.'); }
    render();
  };
  if(!el){ finish(); return; }
  ui.dragging=true;
  el.style.transition='transform .28s ease-in, opacity .28s ease-in';
  el.style.transform=`translateX(${dir*130}%) rotate(${dir*18}deg)`; el.style.opacity='0';
  setTimeout(finish, 260);
}
function bindSwipe(){
  const el=document.getElementById('cqTop'); if(!el) return;
  let x0=null, dx=0, pid=null;
  el.addEventListener('pointerdown', e=>{ if(e.target.closest('button')) return; x0=e.clientX; dx=0; pid=e.pointerId; el.setPointerCapture(pid); ui.dragging=true; el.style.transition='none'; });
  el.addEventListener('pointermove', e=>{ if(x0===null) return; dx=e.clientX-x0;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.style.setProperty('--ok', Math.max(0,Math.min(1,dx/110))); el.style.setProperty('--later', Math.max(0,Math.min(1,-dx/110))); });
  const end=()=>{ if(x0===null) return; x0=null;
    if(Math.abs(dx)>110){ cuDecide(dx>0?1:-1); }
    else { el.style.transition='transform .2s ease-out'; el.style.transform=''; el.style.setProperty('--ok',0); el.style.setProperty('--later',0); ui.dragging=false; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

function addTask(text, viaVoice){
  const t = text.trim();
  if(!t){ ui.err='Type something first'; ui.phone ? renderWin() : renderPop(); return; }
  const k = { id:'c'+(uid++), col:'work', kind:'generic', src:'You · menu bar', title:t, type:guessType(t), pri:2,
    steps:[ S('Work out what done looks like','ai','doing'), S('Pull related context from Slack, docs, and tickets','ai'),
            S('Break it into steps and do the ones it can','ai'), S('Review the plan and take the first step','you') ] };
  if(/stove|buy|order|purchase/i.test(t)){ k.steps[2].sub='Questions will show up here if the answers change the plan'; }
  const rep = parseRepeat(t);
  if(rep){
    k.type='routine'; k.pri=3; k.why='Runs on its own on a schedule';
    k.repeat = {label:rep, next:NEXT[rep] || 'soon', paused:false, runs:[]};
    k.steps = [ S('Set up the schedule','ai','doing',rep), S('Do the first run now','ai'), S('Post results to your Notes page','ai') ];
  }

  render(); toast((viaVoice ? 'Heard you. ' : '') + (rep ? 'Added as a recurring task: '+rep.toLowerCase()+'.' : 'Added. lalo is planning it now.'));
}
function parseRepeat(t){
  const s=t.toLowerCase();
  if(!/\b(every|each|daily|weekly|monthly)\b/.test(s)) return null;
  if(/\b(daily|every day|each day|every morning|each morning)\b/.test(s)) return 'Every day at 9am';
  if(/\b(monthly|every month|each month)\b/.test(s)) return 'First of every month';
  const day = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'].find(d=>s.includes(d));
  if(day){ const D=day[0].toUpperCase()+day.slice(1); const lbl='Every '+D+' at 9am'; NEXT[lbl]=D.slice(0,3)+' 9:00am'; return lbl; }
  return 'Every Monday at 9am';
}

function tick(){
  let changed=false;
  cards.forEach(k=>{
    if(k.col!=='work' || !k.steps) return;
    const i = k.steps.findIndex(s=>s.st==='doing');
    if(i<0) return;
    k.steps[i].st='done'; changed=true;
    if(k.kind==='ship'){ const DONE_SUB={3:'All comments fixed, replied on each thread',4:'142 passed, 0 failed',5:'Live on staging, flag off for customers',6:'4 screenshots'}; if(DONE_SUB[i]) k.steps[i].sub=DONE_SUB[i]; }
    let j=i+1;
    while(j<k.steps.length && k.steps[j].st==='done') j++;
    if(j>=k.steps.length){ k.col='done'; if(k.repeat && !k.repeat.runs.length) k.repeat.runs.unshift(['Today','First run done, posted to your Notes']); return; }
    if(k.steps[j].who==='ai'){ k.steps[j].st='doing'; }
    else { k.col='need'; }
  });
  if(changed) render();
}

  else {
    const order=['shorter','direct','warmer','base']; to = order[(order.indexOf(d.cur)+1)%order.length];
    say='Updated with your note. In the real app Claude rewrites it from what you said; this prototype swaps in a preset version.';
  }
  d.cur=to; d.flash=true; d.chat.push({f:'lalo',t:say});
  renderWin(); d.flash=false;
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button');
  if(!t){ if(ui.pop && !e.target.closest('.pop')){ ui.pop=false; render(); } return; }
  if(t.dataset.themeToggle){ setTheme(isDark() ? 'light' : 'dark'); return; }
  if(t.dataset.voice){ ui.hinted=true; render(); startVoice(); return; }
  if(t.id==='spark'){ openPop(); return; }
  if(t.id==='micBtn'){ ui.pop=false; render(); startVoice(); return; }
  if(t.dataset.open){ openCard(t.dataset.open); return; }
  if(t.dataset.go){ ui.meetOpen=false; ui.win=true; ui.view=t.dataset.go; ui.sel=null; ui.pop=false; ui.side=false; render(); return; }
  if(t.hasAttribute('data-close')){ if(ui.phone){ ui.view='home'; ui.sel=null; } else { ui.win=false; ui.sel=null; } render(); return; }
  if(t.hasAttribute('data-side')){ ui.side=!ui.side; renderWin(); return; }
  if(t.hasAttribute('data-unsel')){ ui.sel=null; renderWin(); return; }
  if(t.id==='recpill'){ ui.meetOpen=true; ui.win=true; ui.view='meetings'; ui.meet=ui.rec&&ui.rec.id; ui.pop=false; render(); return; }
  if(t.dataset.actRec){ if(ui.rec){ ui.win=true; ui.view='meetings'; ui.meet=ui.rec.id; ui.pop=false; render(); } else startRec(); return; }
  if(t.dataset.actStop){ stopRec(); return; }
  if(t.dataset.fill){ const ci=document.getElementById('capIn'); if(ci){ ci.value=t.dataset.fill; ci.focus(); } return; }
  if(t.dataset.inskind){ ui.insKind = ui.insKind || {}; ui.insKind[ui.ins||'personal'] = t.dataset.inskind; ui.more && (ui.more['ins-'+(ui.ins||'personal')] = false); renderWin(); return; }
  if(t.dataset.insmode){ ui.ins=t.dataset.insmode; renderWin(); return; }
  if(t.dataset.ins){
    const [mode,id,a] = t.dataset.ins.split('|'); const x = insights[mode].find(y=>y.id===id);
    if(a==='dismiss'){ x.state='dismissed'; render(); toast("Dismissed. lalo will show fewer insights like this."); return; }
    if(a==='pilot'){ x.state='Pilot planned'; render(); toast('lalo will suggest a team and draft the pilot plan for you.'); return; }
    const isProp = a==='proposal';
    const k = { id:'c'+(uid++), col:'work', kind:'generic', type: a==='routine' ? 'routine' : isProp ? 'plan' : 'task', pri:2,
      why:'From an insight', src: isProp ? 'Insight · '+x.dept : 'Insight · Personal',
      title: isProp ? 'Proposal: '+x.fix.split('.')[0] : x.fix.split('.')[0],
      steps: isProp
        ? [ S('Pull the evidence behind this insight','ai','doing'), S('Estimate cost and time saved','ai'), S('Draft a one-page proposal','ai'), S('Review and share with the department leads','you') ]
        : [ S('Work out what done looks like','ai','doing'), S('Set it up','ai'), S('Check it with you','you') ] };
    if(a==='routine'){ k.repeat={label:'Every Friday at 4pm', next:'Fri 4:00pm', paused:false, runs:[]}; k.pri=3; }
    cards.unshift(k); x.state = isProp ? 'Proposal on board' : 'On board';
    render(); toast(isProp ? 'Added a proposal to your board. lalo is drafting it.' : 'Added to your board.'); return;
  }
  if(t.dataset.catchup){ startCatchup(); return; }
  if(t.dataset.cu){ cuDecide(t.dataset.cu==='ok'?1:-1); return; }
  if(t.dataset.ptab){ ui.ptab=t.dataset.ptab; renderPop(); return; }
  if(t.dataset.more){ ui.more = ui.more || {}; ui.more[t.dataset.more] = !ui.more[t.dataset.more]; render(); return; }
  if(t.dataset.uprec){ const u=upcoming.find(x=>x.id===t.dataset.uprec); u.rec=!u.rec; if(!u.rec) u.why='You turned recording off for this one.'; render(); toast(u.rec ? 'lalo will record '+u.title+'.' : 'lalo won\'t record '+u.title+'.'); return; }
  if(t.dataset.meetOpen){ ui.meetOpen=true; ui.win=true; ui.view='meetings'; ui.meet=t.dataset.meetOpen; ui.pop=false; ui.sel=null; render(); return; }
  if(t.dataset.recUp){ startRec(upcoming.find(x=>x.id===t.dataset.recUp)); return; }
  if(t.dataset.meetback){ ui.meetOpen=false; renderWin(); return; }
  if(t.dataset.meet){ ui.meet=t.dataset.meet; ui.meetOpen=true; renderWin(); const md=document.querySelector('.mdetail'); if(md) md.scrollTop=0; return; }
  if(t.dataset.add){ const [mid,i]=t.dataset.add.split('|'); const m=meetings.find(x=>x.id===mid); addAction(m, m.actions[+i]); render(); toast('Added to the board. lalo is starting on it.'); return; }
  if(t.dataset.addall){ const m=meetings.find(x=>x.id===t.dataset.addall); let n=0; m.actions.forEach(a=>{ if(a.o==='You' && !a.added){ addAction(m,a); n++; } }); render(); toast('Added '+n+' action items to the board.'); return; }
  if(t.dataset.type){ ui.type=t.dataset.type; ui.sel=null; renderWin(); return; }
  if(t.dataset.del){ const [h,i]=t.dataset.del.split('|'); profile[h].splice(+i,1); renderWin(); toast('Removed. lalo will stop using it.'); return; }
  const k = cards.find(x=>x.id===ui.sel);
  if(!k){ if(ui.pop && !t.closest('.pop')){ ui.pop=false; render(); } return; }
  if(t.dataset.tone){ ui._chatFocus=false; tone(k, t.dataset.tone); return; }
  if(t.dataset.pri){ k.pri=+t.dataset.pri; k.whyYou=true; render(); toast('Moved to '+PRI[k.pri]+'. lalo will rank similar '+TYPES[typeOf(k)][0].toLowerCase()+' tasks the same way.'); return; }
  if(t.dataset.sched){ k.repeat.label=t.dataset.sched; k.repeat.next=NEXT[t.dataset.sched]; k.repeat.paused=false; render(); toast('Schedule changed to '+t.dataset.sched.toLowerCase()+'.'); return; }
  if(t.dataset.act==='pause'){ k.repeat.paused=!k.repeat.paused; render(); toast(k.repeat.paused?'Paused.':'Resumed. Next run '+k.repeat.next+'.'); return; }
  if(t.dataset.act==='runnow'){
    toast('Running now…');
    setTimeout(()=>{ k.repeat.runs.unshift(['Today', k.kind==='summary' ? '8 new messages since Friday, 1 new theme' : 'Ran early, results in your Notes']); render(); toast('Done. Results added below.'); }, 1800);
    return;
  }
  if(t.dataset.q!==undefined){
    k.qs[+t.dataset.q].a = t.dataset.a;
    if(k.qs.every(q=>q.a)){
      k.col='work'; k.steps[2].st='doing';
      k.steps[2].sub = `Searching ${k.qs[0].a==='Not sure'?'gas and electric':k.qs[0].a.toLowerCase()} ranges, ${k.qs[1].a.toLowerCase()}`;
      toast('Thanks. lalo is shortlisting now.');
    }
    render(); return;
  }
  if(t.dataset.pick!==undefined){
    k.picked=+t.dataset.pick; const y=k.steps.findIndex(s=>s.who==='you'); k.steps[y].st='done'; k.steps[y+1].st='doing'; k.col='work';
    toast('In the real app, lalo opens the cart with the discount applied. You pay.'); render(); return;
  }
  const a = t.dataset.act;
  if(a==='copy'){
    const txt = k.draft.v[k.draft.cur];
    const ok = ()=>toast('Copied. Paste it into the thread.');
    try{ navigator.clipboard.writeText(txt).then(ok, ()=>{ selectDraft(); toast('Selected. Press ⌘C to copy.'); }); }catch(_){ selectDraft(); toast('Selected. Press ⌘C to copy.'); }
    return;
  }
  if(a==='open'){ toast('In the real app this opens the conversation. Nothing is sent from the prototype.'); return; }
  if(a==='sent'){ k.col='done'; render(); toast('Marked sent. Your edits teach lalo your voice.'); return; }
  if(a==='dismiss'){ cards.splice(cards.indexOf(k),1); ui.sel=null; render(); toast("Dismissed. lalo will flag fewer messages like this."); return; }
  if(a==='ship'){
    const y=k.steps.findIndex(s=>s.who==='you'); k.steps[y].st='done'; k.steps[y+1].st='doing'; k.col='work'; ui.changes=null;
    render(); toast('Approved. Sending engineering the PR, test results, flag, and screenshots.'); return;
  }
  if(a==='changes'){ ui.changes = ui.changes===k.id ? null : k.id; renderWin(); const ci=document.getElementById('changeIn'); if(ci) ci.focus(); return; }
  if(a==='ready' || a==='approve'){ k.col='done'; k.steps && k.steps.forEach(s=>s.st='done'); render(); toast(a==='approve'?'Created 4 tickets.':'Done.'); return; }
});
function selectDraft(){ const el=document.getElementById('draftText'); if(!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='capForm'){ addTask(document.getElementById('capIn').value); }
  if(e.target.id==='changeForm'){
    const k=cards.find(x=>x.id===ui.sel); const inp=document.getElementById('changeIn'); const v=inp.value.trim();
    if(!v){ inp.placeholder='Type what should change first'; inp.focus(); return; }
    k.fixed=k.comments.length; k.comments.push(['You', v]); ui.changes=null;
    k.steps.forEach((s,i)=>{ if(i>=3 && s.who==='ai' && i<7) { s.st='todo'; } });
    k.steps[3].st='doing'; k.steps[3].sub='Working on your change'; k.steps[4].sub='Unit, integration, and end-to-end'; k.steps[5].sub='Redeploy to staging'; k.steps[6].sub='New screenshots';
    k.col='work'; render(); toast('Sent back to lalo. It will fix it, retest, and ask you again.');
    return;
  }
  if(e.target.id==='chatForm'){
    const k=cards.find(x=>x.id===ui.sel); const v=document.getElementById('chatIn').value.trim();
    if(!v){ toast('Type a change first'); return; }
    document.getElementById('chatIn').value=''; ui._chatFocus=true;
    const lc=v.toLowerCase(); const key = /short|brief|trim/.test(lc)?'Shorter':/warm|friend|nice/.test(lc)?'Warmer':/direct|firm|blunt/.test(lc)?'More direct':'custom';
    tone(k, key, v);
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='capIn' && ui.err){ ui.err=''; const er=document.querySelector('.err'); if(er) er.outerHTML='<div class="caphelp">Type here, or just say <b>"Hey lalo…"</b> anytime. Tasks, reminders, or "every Friday, summarize #design".</div>'; } });
document.addEventListener('keydown', e=>{
  if(e.altKey && (e.code==='Space')){ e.preventDefault(); openPop(); return; }
  if(ui.win && ui.view==='catchup' && !e.target.closest('input,textarea')){ if(e.key==='ArrowRight'){ cuDecide(1); return; } if(e.key==='ArrowLeft'){ cuDecide(-1); return; } }
  if(e.key==='Escape'){ if(ui.pop){ ui.pop=false; render(); } else if(ui.sel){ ui.sel=null; renderWin(); } else if(ui.win){ ui.win=false; render(); } }
});

function clock(){ const d=new Date(); document.getElementById('clock').textContent = d.toLocaleDateString(undefined,{weekday:'short'})+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
clock(); setInterval(clock, 15000);
/* ---------- light / dark ---------- */
const DARKQ = window.matchMedia('(prefers-color-scheme: dark)');
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==='dark' : DARKQ.matches; }
function paintThemeBtn(){
  const b=document.getElementById('themeBtn'); if(!b) return;
  b.innerHTML = isDark() ? I.sun : I.moon;
  b.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode');
  b.title = b.getAttribute('aria-label');
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('lalo-theme', t); }catch(_){}
  paintThemeBtn(); render();
}
try{ const saved=localStorage.getItem('lalo-theme'); if(saved==='dark'||saved==='light') document.documentElement.dataset.theme=saved; }catch(_){}
try{ DARKQ.addEventListener('change', ()=>{ paintThemeBtn(); render(); }); }catch(_){}
paintThemeBtn();

const PHONE = window.matchMedia('(max-width: 600px)');
function applyPhone(){
  ui.phone = PHONE.matches;
  document.body.classList.toggle('phone', ui.phone);
  if(ui.phone){ ui.pop=false; ui.hinted=true; ui.win=true; if(!ui.view || ui.view==='board' && !ui._phoneInit) ui.view='home'; ui._phoneInit=true; }
  else if(ui.view==='home'){ ui.view='board'; }
}
applyPhone();
try{ PHONE.addEventListener('change', ()=>{ applyPhone(); render(); }); }catch(_){}
render();
</script>
