<style>
/* Layout: a simulated Mac desktop. Only the menu bar is live at load; the spark opens a popover, the popover opens the board window. */
:root{
  --wall:#cfd5dc; --wall-dot:rgba(22,28,38,.07); --wall-ink:rgba(22,28,38,.34);
  --bar:rgba(244,246,248,.86); --bar-fg:#16181d;
  --panel:#fcfcfd; --panel-2:#f2f3f6; --panel-3:#e9ebef; --line:#e1e4ea; --line-strong:#c9cdd5;
  --fg:#15171c; --fg-2:#565c68; --fg-3:#8a909b;
  --accent:#5a3bea; --accent-bg:#ece8fd; --accent-ink:#3b22b0;
  --hot:#c2412d; --hot-bg:#fde8e3; --switch-on:#2f9e55;
  --ai:#2458c4; --ai-bg:#e5edfd; --help:#6f45c9; --help-bg:#efe8fd; --ok:#2b7d47; --ok-bg:#e1f2e6;
  --shadow:0 24px 60px rgba(14,18,28,.24),0 2px 8px rgba(14,18,28,.12);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* Type scale: use these, not raw px */
  --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:24px; --fs-2xl:30px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#1a1d23; --wall-dot:rgba(235,240,250,.06); --wall-ink:rgba(235,240,250,.32);
  --bar:rgba(30,33,39,.86); --bar-fg:#eceef2;
  --panel:#212429; --panel-2:#292d34; --panel-3:#323741; --line:#353a44; --line-strong:#4a505c;
  --fg:#eceef2; --fg-2:#a6acb8; --fg-3:#757b87;
  --accent:#7158f5; --accent-bg:#27214d; --accent-ink:#b9adff;
  --hot:#ff8a70; --hot-bg:#3d1d16;
  --ai:#8ab0ff; --ai-bg:#1c2a45; --help:#b9a0ff; --help-bg:#2b2346; --ok:#74d197; --ok-bg:#1a3223;
  --shadow:0 24px 60px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#1a1d23; --wall-dot:rgba(235,240,250,.06); --wall-ink:rgba(235,240,250,.32);
  --bar:rgba(30,33,39,.86); --bar-fg:#eceef2;
  --panel:#212429; --panel-2:#292d34; --panel-3:#323741; --line:#353a44; --line-strong:#4a505c;
  --fg:#eceef2; --fg-2:#a6acb8; --fg-3:#757b87;
  --accent:#7158f5; --accent-bg:#27214d; --accent-ink:#b9adff;
  --hot:#ff8a70; --hot-bg:#3d1d16;
  --ai:#8ab0ff; --ai-bg:#1c2a45; --help:#b9a0ff; --help-bg:#2b2346; --ok:#74d197; --ok-bg:#1a3223;
  --shadow:0 24px 60px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
@supports (height:100dvh){html,body,.desk{height:100dvh}}
body{background:var(--wall);color:var(--fg);font-family:var(--body);font-size:var(--fs-base);line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.desk{position:relative;height:100%;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1px,transparent 1.2px);background-size:22px 22px}

/* menu bar */
.bar{position:relative;z-index:30;height:30px;display:flex;align-items:center;gap:16px;background:var(--bar);color:var(--bar-fg);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:var(--fs-sm)}
.bar .menus{display:flex;gap:16px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.bar .menus b{font-weight:600}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.bar svg{width:16px;height:16px;display:block}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bar-fg);opacity:.85}
.spark{position:relative;display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;border:0;background:var(--accent);color:#fff}
.spark:hover,.spark[aria-expanded="true"]{filter:brightness(1.12)}
.spark .n{font-family:var(--mono);font-size:var(--fs-xs);font-weight:500;min-width:8px}
.spark .pip{width:6px;height:6px;border-radius:50%;background:#fff}
.spark .glyph{color:#fff}
.clock{font-variant-numeric:tabular-nums}

/* first-load hint */
.hint{position:absolute;z-index:25;top:40px;right:max(70px,calc(env(safe-area-inset-right,0px) + 70px));background:var(--fg);color:var(--panel);
  padding:8px 12px;border-radius:10px;font-size:var(--fs-sm);max-width:240px;animation:bob 2.4s ease-in-out infinite}
.hint::before{content:"";position:absolute;top:-6px;right:22px;width:12px;height:12px;background:var(--fg);transform:rotate(45deg);border-radius:2px}
.hint kbd{white-space:nowrap;font-family:var(--mono);font-size:var(--fs-2xs);padding:1px 5px;border-radius:4px;background:rgba(127,127,127,.3)}
@keyframes bob{50%{transform:translateY(3px)}}
.wordmark{position:absolute;inset:30% 0 auto 0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(64px,14vw,168px);
  letter-spacing:-.04em;color:var(--wall-ink);opacity:.5;pointer-events:none;user-select:none;line-height:1}
.wordmark small{display:block;font-family:var(--body);font-weight:400;font-size:var(--fs-base);letter-spacing:0;margin-top:10px;opacity:1}

/* popover */
.pop{position:absolute;z-index:40;top:36px;right:max(8px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 16px));background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transform-origin:top right}
.pop.anim{animation:pop .16s ease-out}
.pop{max-height:calc(100% - 44px);overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}
.cap{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.cap input{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--fg);padding:0 12px;font:inherit}
.cap input::placeholder{color:var(--fg-3)}
.iconbtn{width:38px;height:38px;flex:none;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px}
.iconbtn.go{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.caphelp{padding:6px 14px 0;font-size:var(--fs-xs);color:var(--fg-3)}
.err{color:#c2412d;font-size:var(--fs-xs);padding:6px 14px 0}
.sec{padding:10px 6px 4px}
.sec h3{margin:0 8px 4px;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px}
.row:hover{background:var(--panel-2)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:var(--fs-xs);color:var(--fg-2);white-space:nowrap;max-width:42%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mark{width:8px;height:8px;border-radius:50%;flex:none}
.mark.need{background:var(--accent)} .mark.work{border:2px solid var(--ai);border-right-color:transparent;width:10px;height:10px;animation:spin 1s linear infinite} .mark.done{background:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.popfoot{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);margin-top:6px}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:var(--fs-sm);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.btn.pri:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn svg{width:15px;height:15px}
.grow{flex:1}

/* window */
.win{position:absolute;z-index:20;left:50%;top:52px;transform:translateX(-50%);width:min(1080px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));
  height:calc(100% - 52px - 96px);max-height:720px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:184px minmax(0,1fr);overflow:hidden}
.win.anim{animation:pop .18s ease-out}
.side{background:var(--panel-2);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.lights{display:flex;gap:7px;padding:2px 4px 14px}
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0}
.lights .c{background:#ec6a5e}.lights .m{background:#f4bf4f}.lights .z{background:#61c554}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.03em;padding:0 8px 12px;display:flex;align-items:center;gap:6px}
.brand svg{width:18px;height:18px;color:var(--accent)}
.nav{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:7px 8px;border-radius:7px;text-align:left;color:var(--fg-2)}
.nav[aria-current="page"]{background:var(--panel-3);color:var(--fg);font-weight:500}
.nav svg{width:16px;height:16px}
.nav .c{margin-left:auto;font-family:var(--mono);font-size:var(--fs-2xs)}
.sidefoot{margin-top:auto;font-size:var(--fs-2xs);color:var(--fg-3);padding:8px;line-height:1.5}
.main{position:relative;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.mainhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mainhead h1{margin:0;font-family:var(--display);font-size:var(--fs-lg);font-weight:500;letter-spacing:-.02em}
.mainhead .sub{color:var(--fg-3);font-size:var(--fs-sm)}
.mh-rec{height:28px;font-size:var(--fs-xs);padding:0 10px}
.mh-rec svg{width:14px;height:14px;color:var(--hot)}
.menu-btn{display:none}

.board{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:14px;padding:16px 18px;align-items:start}
.colstack{display:flex;flex-direction:column;gap:14px;min-width:0}
.col{background:var(--panel-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;align-self:start}
.col h2{margin:2px 4px 2px;font-size:var(--fs-xs);font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:7px}
.col h2 .c{margin-left:auto;font-family:var(--mono);font-weight:400;color:var(--fg-3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:7px;width:100%}
.card:hover{border-color:var(--line-strong)}
.card[aria-current="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.card.need{border-left:3px solid var(--accent);border-radius:0 10px 10px 0}
.card .src{font-size:var(--fs-2xs);color:var(--fg-3);display:flex;gap:6px;align-items:center}
.card .ttl{font-weight:500;line-height:1.35}
.bar-p{height:4px;border-radius:2px;background:var(--panel-3);overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--ai);transition:width .4s}
.empty{font-size:var(--fs-xs);color:var(--fg-3);padding:10px 6px;text-align:center}

.tag{display:inline-flex;align-items:center;font-size:var(--fs-2xs);font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap;align-self:flex-start}
.tag.ai{background:var(--ai-bg);color:var(--ai)} .tag.help{background:var(--help-bg);color:var(--help)}
.tag.you{background:var(--accent-bg);color:var(--accent-ink)} .tag.ok{background:var(--ok-bg);color:var(--ok)}

/* detail drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  box-shadow:-16px 0 40px rgba(0,0,0,.08);z-index:5}
.drawer.anim{animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dhead{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dhead h2{margin:4px 0 0;font-family:var(--display);font-weight:500;font-size:var(--fs-lg);letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.dbody{flex:1;overflow:auto;padding:4px 18px 18px}
.dsec{margin-top:16px}
.dsec>h3{margin:0 0 6px;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .ic{width:18px;height:18px;flex:none;margin-top:1px;display:grid;place-items:center}
.step .ic svg{width:17px;height:17px}
.step .tx{flex:1;min-width:0}
.step .tx small{display:block;color:var(--fg-2);font-size:var(--fs-xs);margin-top:1px}
.step.done .tx>span{color:var(--fg-2)}
.ring{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
.ring.doing{border-color:var(--ai);border-right-color:transparent;animation:spin 1s linear infinite}
.q{margin:12px 0 6px;font-size:var(--fs-sm);color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);font-size:var(--fs-sm)}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.ctx{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:var(--fs-sm);color:var(--fg-2)}
.ctx b{color:var(--fg);font-weight:500}
.draft{border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;font-size:var(--fs-base);line-height:1.55;white-space:pre-wrap;background:var(--panel)}
.draft.flash{animation:flash .6s ease-out}
@keyframes flash{from{background:var(--accent-bg)}}
.commit{font-size:var(--fs-xs);color:var(--accent-ink);background:var(--accent-bg);border-radius:8px;padding:6px 10px;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.msg{max-width:88%;padding:7px 11px;border-radius:12px;font-size:var(--fs-sm);line-height:1.45}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--panel);border-bottom-right-radius:4px}
.msg.lalo{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:4px}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin input{flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--fg);padding:0 12px;font:inherit}
.li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.notes-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.notes-head h3{margin:0;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.notes-hint{font-size:var(--fs-2xs);color:var(--fg-3)}
.notes-hint code,.notes-hint kbd{font-family:var(--mono);font-size:var(--fs-2xs);background:var(--panel-3);border-radius:4px;padding:1px 4px}
.notes-edit{height:26px;font-size:var(--fs-xs);padding:0 8px}
.md{font-size:var(--fs-base);line-height:1.55;border-radius:10px;padding:2px 10px;margin:0 -10px;cursor:text}
.md:hover{background:var(--panel-2)}
.md h2{margin:12px 0 4px;font-size:var(--fs-base);font-weight:600;color:var(--fg)}
.md h2:first-child,.md h3:first-child{margin-top:4px}
.md h3,.md h4{margin:10px 0 4px;font-size:var(--fs-base);font-weight:600}
.md p{margin:4px 0}
.md ul,.md ol{margin:2px 0 6px;padding-left:20px}
.md li{margin:2px 0}
.md li::marker{color:var(--fg-3)}
.md .md-task{list-style:none;margin-left:-20px;display:flex;gap:8px;align-items:baseline}
.md .md-box{flex:none;width:12px;height:12px;border:1.5px solid var(--line-strong);border-radius:3px;transform:translateY(1px)}
.md .md-task.done{color:var(--fg-3);text-decoration:line-through}
.md .md-task.done .md-box{background:var(--accent);border-color:var(--accent)}
.md .md-task.done .md-box::after{content:"";display:block;width:3px;height:6px;margin:1px 0 0 3px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.md code{font-family:var(--mono);font-size:var(--fs-xs);background:var(--panel-3);border-radius:4px;padding:1px 4px}
.md a{color:var(--accent-ink)}
.note-in{display:block;width:100%;box-sizing:border-box;min-height:160px;resize:vertical;border:1.5px solid var(--accent);box-shadow:0 0 0 3px var(--accent-bg);border-radius:10px;padding:10px 12px;background:var(--panel);color:var(--fg);font-family:var(--mono);font-size:var(--fs-sm);line-height:1.6;outline:none}
.notes-acts{display:flex;align-items:center;gap:8px;margin-top:8px}
.mq-intro{margin:0 0 8px;font-size:var(--fs-sm);color:var(--fg-2)}
.mq-thread{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mq-a{white-space:pre-line}
.mq-q{margin:8px 0 0;padding:6px 10px;border-left:2px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:var(--fs-sm);line-height:1.45;color:var(--fg)}
.mq-q b{font-weight:600;margin-right:6px}
.mq-q small{display:block;margin-top:2px;font-size:var(--fs-2xs);color:var(--fg-3)}
.mq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mq-chips .chip{height:28px;font-size:var(--fs-xs)}
.mq-foot{flex:none;padding:10px 18px 14px;border-top:1px solid var(--line);background:var(--panel)}
.mq-foot .mq-pill{width:100%;height:52px;min-height:52px;align-items:center;padding-top:0;padding-bottom:0;box-shadow:none}
body.phone .mq-foot{position:absolute;z-index:6;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));padding:0;border:0;background:transparent}
body.phone .mq-foot .mq-pill{height:54px;min-height:54px;border-radius:27px;padding:0 6px 0 18px;box-shadow:0 8px 24px rgba(0,0,0,.14)}

/* Small markdown subset for meeting notes: headings, lists, checkboxes, bold, italic, code, links */
function mdInline(t){
  return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  String(src||'').split('\n').forEach(line=>{
    const l=line.replace(/\s+$/,''); let x;
    if(!l.trim()){ close(); return; }
    if((x=l.match(/^(#{1,3})\s+(.*)$/))){ close(); out.push(`<h${x[1].length+1}>${mdInline(x[2])}</h${x[1].length+1}>`); return; }
    if((x=l.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)$/i))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push(`<li class="md-task ${x[1].trim()?'done':''}"><span class="md-box"></span>${mdInline(x[2])}</li>`); return; }
    if((x=l.match(/^\s*[-*]\s+(.*)$/))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push(`<li>${mdInline(x[1])}</li>`); return; }
    if((x=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push(`<li>${mdInline(x[1])}</li>`); return; }
    close(); out.push(`<p>${mdInline(l)}</p>`);
  });
  close(); return out.join('');
}

const TYPES = { build:['Build','code'], reply:['Reply','chat'], prep:['Meeting prep','cal'], errand:['Errand','bag'], plan:['Planning','list'], routine:['Routine','repeat'], task:['Task','dot'] };
const PRI = {1:'Now', 2:'Next', 3:'Later'};
function typeOf(k){
  if(k.type) return k.type;
  if(k.repeat) return 'routine';
  return {ship:'build', draft:'reply', prep:'prep', stove:'errand', tickets:'plan', summary:'routine'}[k.kind] || 'task';
}
const SEED_PRI = {
  c7:[1,'Product change for the Q4 checkout goal. Your rule: product changes before Slack replies'],
  c2:[2,'Jordan is waiting on you to confirm a date'],
  c4:[2,'The 1:1 is Tuesday'],
  c3:[2,'Needs to be in before the next tenant'],
  c1:[3,'No deadline, and Theo already gave feedback'],
  c5:[3,'Tickets can wait for Monday planning'],
  c6:[3,'Runs on its own every Friday']
};
cards.forEach(k=>{ const p=SEED_PRI[k.id]; if(p){ k.pri=p[0]; k.why=p[1]; } });
{ const st=cards.find(c=>c.id==='c3'); st.qOrder=[3,0,1,2]; st.log=[{type:'lalo', t:"I broke this into 8 steps. I need a few answers first, one at a time."}]; }
const byPri = (a,b) => (a.pri||2) - (b.pri||2);
function guessType(t){
  const s=t.toLowerCase();
  if(/\b(reply|respond|answer|get back to)\b/.test(s)) return 'reply';
  if(/\b(fix|build|ship|bug|code|deploy|implement|add .* to)\b/.test(s)) return 'build';
  if(/\b(1:1|meeting|prep|call with)\b/.test(s)) return 'prep';
  if(/\b(buy|order|purchase|book|return)\b/.test(s)) return 'errand';
  if(/\b(ticket|plan|roadmap|scope)\b/.test(s)) return 'plan';
  return 'task';
}

function counts(){ const c={need:0,work:0,done:0}; cards.forEach(k=>c[k.col]++); return c; }
function progress(k){ if(!k.steps) return null; const d=k.steps.filter(s=>s.st==='done').length; return {d, n:k.steps.length}; }
function status(k){
  if(k.planning) return 'Planning with you';
  if(k.col==='done' && k.repeat) return k.repeat.paused ? 'Paused' : 'Next run '+k.repeat.next;
  if(k.col==='done') return k.kind==='ship' ? 'Sent to engineering' : 'Done';
  if(k.col==='need' && k.kind==='ship') return 'Ready for your review';
  if(k.kind==='draft') return 'Draft ready';
  if(k.kind==='stove' && k.qs.some(q=>!q.a)) { const n=k.qs.filter(q=>!q.a).length; return n+(n>1?' questions':' question'); }
  if(k.col==='need'){
    if(k.kind==='prep') return 'Brief ready';
    if(k.kind==='tickets') return '4 tickets to review';
    if(k.kind==='stove') return '3 options to pick from';
    return 'Plan ready';
  }
  const doing = k.steps && k.steps.find(s=>s.st==='doing');
  return doing ? doing.t : 'Planning steps';
}

function popRecap(){
  const now=new Date(), h=now.getHours(); const c=counts();
  const need=cards.filter(k=>k.col==='need').sort(byPri);
  const nextM=upcoming.map(u=>({u, t:u.at})).filter(x=>x.t>now).sort((a,b)=>a.t-b.t)[0];
  const mins = nextM ? Math.round((nextM.t-now)/60000) : null;
  const when = mins==null ? '' : mins<60 ? `in ${mins} min` : `at ${nextM.u.time}`;
  const open = h<12 ? "Here's your morning." : h<17 ? "Here's where things stand." : "Before you wrap up:";
  const parts=[];
  if(need.length) parts.push(`${need.length} ${need.length>1?'things need':'thing needs'} you`);
  if(nextM) parts.push(`${nextM.u.title} ${when}`);
  if(c.work) parts.push(`I'm working on ${c.work}`);
  const line = parts.length ? parts.join(' · ') : "Nothing needs you right now.";
  const tip = need[0] ? proactive(need[0]).say : nextM ? `Next up is ${nextM.u.title}. I'll ask if you want to record it when it starts.` : "Enjoy the quiet. I'll ping you when something comes in.";
  return { open, line, tip, need, nextM, when };
}

function boardSummary(){

  const by = {
    c2:{ brief:'Jordan is waiting on the Nov 3 date', say:'Jordan is waiting on the Nov 3 date. I drafted a reply proposing a smaller test on Nov 10.' },
    c1:{ brief:'Maya wants feedback on the landing page', say:'Maya asked for feedback on the landing page. I drafted it in your voice.' },
    c7:{ brief:'the save-card change is ready for your review', say:"Save card is on staging, tests pass, and the review comments are fixed." },
    c5:{ brief:'4 tickets from the design review are drafted', say:'I drafted 4 tickets from the design review.' },
    c3:{ brief:"mom's stove needs a few answers", say:"For mom's stove, I need a few quick answers before I start shopping." }
  }[k.id] || { brief:k.title.charAt(0).toLowerCase()+k.title.slice(1), say:k.title };

function todayCards(){

    const ready=prep.col==='need';
    out.push({ key:'prep', open:'data-open="c4"', icon:I.cal, kind:'Meeting', brief:'prep for your 1:1 with Sara on Tuesday',
      say: prep.preread && (cards.find(x=>x.id===prep.preread)||{}).col!=='need' ? "Pre-read sent to Sara. Your talking points are ready for Tuesday." : prep.preread ? "I drafted a pre-read for Sara. It's waiting for your approval." : ready ? "Your 1:1 with Sara is Tuesday at 2pm. I prepped talking points. Want me to send her a pre-read?" : "Your 1:1 with Sara is Tuesday at 2pm. I'm prepping talking points now.",
      cta: prep.preread ? 'Review the pre-read' : 'Send her a pre-read', ctaAttr: prep.preread ? `data-open="${prep.preread}"` : 'data-preread="1"', alt:['Open prep', `data-open="c4"`] });
  }
  cards.filter(k=>k.col==='need' && k.id!=='c4' && !(prep && prep.preread===k.id)).sort(byPri).forEach(k=>{
    const p=proactive(k);
    out.push({ key:k.id, reply: k.kind==='draft' && k.from ? k : null, open:`data-open="${k.id}"`, icon:I[TYPES[typeOf(k)][1]], kind:TYPES[typeOf(k)][0], brief:p.brief, say:p.say, cta:p.cta,

  if(sig) out.push({ key:'sig', open:'data-go="signals"', icon:I.radar, kind:'Signal', brief:`${sig.short||sig.theme.toLowerCase()} are rising this week`,

  return out;
}

function meetAnswer(m, q){
  const lc=q.toLowerCase(), T=m.transcript;
  const find = words => T.map((l,i)=>({l,i,sc:words.reduce((a,w)=>a+(l[1].toLowerCase().includes(w)?1:0),0)})).filter(x=>x.sc).sort((a,b)=>b.sc-a.sc||a.i-b.i);

  const hit=(m.qa||[]).find(x=>x[0].test(lc) && !/promis|owe/.test(lc));
  if(hit) return { t:hit[1], quotes:hit[2].map(n=>[T[n-1][0], T[n-1][1], n]) };
  if(/summar|recap|tl;?dr|overview|key points|what happened/.test(lc)) return { t:'Here\'s the short version:\n'+m.summary.map(x=>'• '+x).join('\n') };
  if(/decid|decision|agree|settle/.test(lc)){
    const qs=find(['first','agreed','okay','decid','revisit']).slice(0,2).map(quote);
    return { t: m.decisions.length ? (m.decisions.length>1?'You decided:\n'+m.decisions.map(x=>'• '+x).join('\n'):'You decided to '+m.decisions[0].charAt(0).toLowerCase()+m.decisions[0].slice(1)+'.') : 'No clear decision was made.', quotes:qs };
  }
  if(/action|follow|to-?do|next step|who.*(do|own|tak)|doing what|promis|owe/.test(lc)){
    const mine=/promis|owe|\bi\b|\bme\b/.test(lc) && !/who/.test(lc);
    const list=m.actions.filter(a=>!mine||a.o==='You');
    return { t:(mine?'You said you would:\n':'Here\'s who owns what:\n')+list.map(a=>'• '+(mine?'':a.o+': ')+a.t).join('\n'),
      quotes: T.map((l,i)=>({l,i})).filter(x=>/\bI\'ll\b/.test(x.l[1]) && (!mine||x.l[0]==='You')).slice(0,2).map(quote) };
  }
  const people=[...new Set(T.map(l=>l[0]))].filter(n=>n!=='You');
  const who=people.find(n=>lc.includes(n.toLowerCase()));
  const words=(lc.match(/[a-z0-9']+/g)||[]).filter(w=>w.length>2 && !MQ_STOP.has(w) && (!who || w!==who.toLowerCase())).map(w=>w.replace(/(ing|ed|es|s)$/,''));
  let hits = words.length ? find(words) : [];
  if(who) hits = (hits.length ? hits.filter(x=>x.l[0]===who) : []).concat(T.map((l,i)=>({l,i})).filter(x=>x.l[0]===who && !hits.some(h=>h.i===x.i))).slice(0,2);
  else hits = hits.slice(0,2);
  if(!hits.length) return { t:"I couldn't find that in the transcript. Try one of the questions above, or ask about something someone said." };
  return { t: who ? `Here's what ${who} said:` : "Here's what was said:", quotes:hits.map(quote) };
}

  el.addEventListener('pointermove', e=>{ if(x0===null) return; dx=e.clientX-x0;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;

}

function sparkSVG(v, labels){

  return `<svg class="pt-spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${v.length} weeks: ${v.map(sigVal).join(', ')}">
    <polyline points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${v.map((x,i)=>`<g class="sp-pt"><circle cx="${X(i)}" cy="${Y(x)}" r="10" fill="transparent"/><circle cx="${X(i)}" cy="${Y(x)}" r="${i===v.length-1?4:0}" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/><title>Week of ${labels[i]}: ${sigVal(x)}</title></g>`).join('')}</svg>`;
}
function barsSVG(w){

  return `<svg class="th-bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mentions per week: ${w.join(', ')}">${w.map((x,i)=>{ const h=Math.max(2, x/max*H);
    return `<g><rect x="${i*(bw+gap)}" y="${H-h}" width="${bw}" height="${h}" rx="2" fill="var(--accent)" opacity="${i===w.length-1?1:.35}"/><title>${['3 weeks ago','2 weeks ago','Last week','This week'][i]}: ${x} mention${x===1?'':'s'}</title></g>`; }).join('')}</svg>`;
}

function nextNeedAfter(id){

const SPLASH_SECS = 5;
function actWithSplash(k, fn, opts){
  opts=opts||{};
  const idx=cards.indexOf(k); const snap=JSON.parse(JSON.stringify(k, (key,v)=> key==='liveP'||key==='planning' ? undefined : v));
  const keep={ liveP:k.liveP, planning:k.planning };
  const nl=nextNeedAfter(k.id);
  ui.captureToast=true; ui.capturedMsg=''; let res;
  try{ res=fn(); } finally{ ui.captureToast=false; }
  if(res===false) return;
  const next=nl.map(id=>cards.find(x=>x.id===id)).find(c=>c && c.col==='need');
  clearInterval(ui.splashTimer);
  ui.splash={ stay: !!opts.stay, id:k.id, title:k.title, msg: opts.msg || ui.capturedMsg || 'Done.', kind: opts.kind || 'done', snap, keep, idx, next: next ? next.id : null, nextTitle: next ? next.title : '', left:SPLASH_SECS };
  ui.sel=null; ui.menuFor=null; render();
  ui.splashTimer=setInterval(()=>{ if(!ui.splash){ clearInterval(ui.splashTimer); return; } ui.splash.left--; if(ui.splash.left<=0) splashContinue(); else { const c=document.getElementById('spCount'); if(c) c.textContent=ui.splash.left; const r=document.querySelector('.sp-ring'); if(r) r.style.setProperty('--p', Math.round(ui.splash.left/SPLASH_SECS*100)); } }, 1000);
}
function splashContinue(){
  const S0=ui.splash; clearInterval(ui.splashTimer); if(!S0) return; ui.splash=null;
  if(S0.stay){ ui.sel=null; render(); return; }
  if(S0.next && cards.find(x=>x.id===S0.next && x.col==='need')){ ui.sel=S0.next; render(); const b=document.getElementById('cuBody'); if(b) b.scrollTop=0; }
  else { ui.sel=null; if(ui.returnTo){ ui.view=ui.returnTo; ui.returnTo=null; } else if(ui.phone){ ui.view='board'; } render(); }
}
function splashUndo(){
  const S0=ui.splash; clearInterval(ui.splashTimer); if(!S0) return; ui.splash=null;
  let k=cards.find(x=>x.id===S0.id);
  if(k){ Object.keys(k).forEach(key=>delete k[key]); Object.assign(k, S0.snap, S0.keep); }
  else { k=Object.assign(S0.snap, S0.keep); cards.splice(Math.min(S0.idx,cards.length),0,k); }
  Object.keys(k).forEach(key=>{ if(k[key]===undefined) delete k[key]; });
  if(ui.talkDraft) Object.keys(ui.talkDraft).forEach(key=>{ if(key===k.id || key.startsWith(k.id+':')) delete ui.talkDraft[key]; });
  ui.sel=k.id; render();
}

function discardTask(k){
  if(ui.sel===k.id){ return actWithSplash(k, ()=>{ const i=cards.indexOf(k); cards.splice(i,1); if(ui.planning && ui.planning.cardId===k.id) ui.planning=null; return true; }, {msg:'Task discarded', kind:'discard'}); }
  const idx=cards.indexOf(k); if(idx<0) return;
  cards.splice(idx,1);
  if(ui.planning && ui.planning.cardId===k.id) ui.planning=null;
  const wasOpen = ui.sel===k.id; const nl = wasOpen ? nextNeedAfter(k.id) : [];
  if(wasOpen) ui.sel=null;
  if(ui.cq) ui.cq=ui.cq.filter(id=>id!==k.id);
  ui.menuFor=null; if(wasOpen) goNextFrom(nl, true); else render();
  toast('Task discarded', {label:'Undo', fn:()=>{ cards.splice(Math.min(idx,cards.length),0,k); render(); toast('Task restored'); }});
}

/* ---------- plan a new task together (chat before creating it) ---------- */
const PLAN_TPL = {
  reply:  [['Read the thread and related context','ai'],['Draft the reply in your voice','ai'],['Review and send it','you']],
  build:  [['Read the ticket and the code','ai'],['Make the change and open a pull request','ai'],['Run tests and deploy behind a flag','ai'],['Review screenshots and approve','you']],
  errand: [['Research options that fit','ai'],['Find discounts and compare total cost','ai'],['Pick one and pay','you']],
  prep:   [['Pull your past notes with them','ai'],['Scan related work around the company','ai'],['Draft talking points','ai'],['Decide what you want out of it','you']],
  plan:   [['Gather the decisions and context','ai'],['Draft the tickets or plan','ai'],['Review and create them','you']],
  task:   [['Work out what done looks like','ai'],['Gather context from Slack, docs, and tickets','ai'],['Do a first draft','ai'],['Review it together','you']]
};
const ROUTINE_TPL = [['Set up the schedule','ai'],['Do the first run now','ai'],['Post the results to your Notes','ai']];
function startPlanning(text, viaVoice){
  if(ui.gs && text && text.trim()) ui.gs.task=true;
  const t=text.trim(); if(!t) return;
  const title=t.charAt(0).toUpperCase()+t.slice(1);
  const type=guessType(t), rep=parseRepeat(t);
  const tpl = rep ? ROUTINE_TPL : (PLAN_TPL[type]||PLAN_TPL.task);
  const qs=[];
  if(!rep) qs.push({id:'due', q:'When do you need this done?', o:['Today','This week','Next week','No rush']});
  qs.push({id:'check', q:'When should I check in with you?', o:['Before anything goes out','Only at the end','Only if I get stuck']});
  if(type==='errand') qs.push({id:'budget', q:"What's your budget?", o:['Under $100','$100 to $500','$500+','Not sure']});
  if(type==='reply') qs.push({id:'tone', q:'What tone should the reply have?', o:['Short and direct','Warm','Formal']});
  const P = { title, type: rep?'routine':type, rep, steps: tpl.map(x=>({t:x[0], who:x[1]})), qs, order: qs.map((_,i)=>i),
    chat:[ {f:'lalo', t:`Got it: "${title}". I added it to your tasks. Before I start, let's plan it together. Here's a first draft, and a couple of quick questions.`} ] };
  const k = { id:'c'+(uid++), col:'need', kind:'generic', src:'You', title, type:P.type, pri:2, why:'Planning with you', planning:P };
  P.cardId = k.id; cards.unshift(k);
  ui.planning = P;
  ui.ask=false; ui.pop=false; ui.win=true; if(!ui.view || ui.view==='catchup') ui.view = ui.phone ? 'home' : 'board';
  render(); if(viaVoice) toast('Heard you. Let\'s plan it.');
}
function pNextQ(){ const P=ui.planning; return P.order.find(i=>!P.qs[i].a); }
function pApply(){
  const P=ui.planning; const check=(P.qs.find(q=>q.id==='check')||{}).a;
  P.steps.forEach(s=>{ if(s.who==='you' && !s.check) s.sub = check==='Only if I get stuck' ? "I'll only ping you if I get stuck" : ''; });
  const hasCheckStep = P.steps.some(s=>s.check);
  if(check==='Before anything goes out' && !hasCheckStep && P.steps.length>1){ P.steps.splice(P.steps.length-1,0,{t:'Check with you before anything goes out',who:'you',check:true}); }
  if(check!=='Before anything goes out' && hasCheckStep){ P.steps=P.steps.filter(s=>!s.check); }
}
function pThink(after, ms){
  const P=ui.planning; P.thinking=true; renderWin(); pScroll();
  setTimeout(()=>{ if(ui.planning!==P) { P.thinking=false; return; } P.thinking=false; after(); renderWin(); pScroll(); }, ms||750);
}
function pAnswer(i, a){
  const P=ui.planning, q=P.qs[i];
  P.chat.push({f:'lalo', t:q.q, asked:true}); P.chat.push({f:'me', t:a}); q.a=a; pApply();
  pThink(()=>{ if(pNextQ()===undefined) P.chat.push({f:'lalo', t:"Thanks. Here's the plan. Change anything below, or tap Start and I'll begin."}); }, 600);
}
function pSkip(i){
  const P=ui.planning, q=P.qs[i];
  P.chat.push({f:'lalo', t:q.q, asked:true}); P.chat.push({f:'me', t:'Skip for now'});
  q.skipped=true; q.a='(later)';
  pThink(()=>{ P.chat.push({f:'lalo', t:"No problem. I'll ask again later."}); if(pNextQ()===undefined) P.chat.push({f:'lalo', t:"Here's the plan. Change anything below, or tap Start and I'll begin."}); }, 600);
}
function pSend(text){
  const P=ui.planning;
  if(DISCARD_RE.test(text.trim())){ const k=cards.find(c=>c.id===P.cardId); if(k) discardTask(k); return; }
  P.chat.push({f:'me', t:text});
  pThink(()=>pReply(text));
}
function pReply(text){
  const P=ui.planning; const lc=text.toLowerCase();
  if(P.started){ P.chat.push({f:'lalo', t:"Noted. I'll factor that in as I go."}); return; }
  const qi=pNextQ();
  const isEdit = /^(please\s+)?(add|include|remove|drop|delete)\b/.test(lc) || /\bstep\s*\d+\b/.test(lc);
  if(qi!==undefined && !isEdit){
    const q=P.qs[qi]; const hit=q.o.find(o=>lc.includes(o.toLowerCase()));
    q.a = hit || text; pApply();
    P.chat.push({f:'lalo', t: pNextQ()===undefined ? "Got it. Here's the plan. Change anything below, or tap Start." : 'Got it.'});
  } else {
    const num=(lc.match(/\b(\d+)\b/)||[])[1];
    if(/remove|drop|delete|skip/.test(lc) && num && P.steps[+num-1]){ const g=P.steps.splice(+num-1,1)[0]; P.chat.push({f:'lalo', t:`Removed step ${num}: ${g.t}.`}); }
    else if(/\b(i'?ll|me|myself)\b/.test(lc) && num && P.steps[+num-1]){ P.steps[+num-1].who='you'; P.chat.push({f:'lalo', t:`Okay, step ${num} is yours. I'll get everything ready for it.`}); }
    else if(/add|include|also|before|after/.test(lc)){
      const t=text.replace(/^(please\s+)?(add|include|also)\s+(a\s+step\s+(to|for)\s+)?/i,'').replace(/\.$/,'');
      P.steps.splice(Math.max(P.steps.length-1,0),0,{t:t.charAt(0).toUpperCase()+t.slice(1), who:'ai'});
      P.chat.push({f:'lalo', t:`Added "${t}" before your final step.`});
    } else P.chat.push({f:'lalo', t:"Noted. I'll keep that in mind. Anything else to change before I start?"});
  }
}

function addTask(text, viaVoice, quiet){
  const t = text.trim();
  if(!t){ ui.err='Type something first'; ui.phone ? renderWin() : renderPop(); return; }
  const k = { id:'c'+(uid++), col:'work', kind:'generic', src:'You', title:t, type:guessType(t), pri:2,
    steps:[ S('Work out what done looks like','ai','doing'), S('Pull related context from Slack, docs, and tickets','ai'),
            S('Break it into steps and do the ones it can','ai'), S('Review the plan and take the first step','you') ] };
  if(/stove|buy|order|purchase/i.test(t)){ k.steps[2].sub='Questions will show up here if the answers change the plan'; }
  const rep = parseRepeat(t);
  if(rep){
    k.type='routine'; k.pri=3; k.why='Runs on its own on a schedule';
    k.repeat = {label:rep, next:NEXT[rep] || 'soon', paused:false, runs:[]};
    k.steps = [ S('Set up the schedule','ai','doing',rep), S('Do the first run now','ai'), S('Post results to your Notes page','ai') ];
  }
  cards.unshift(k); ui.err='';
  const inp=document.getElementById('capIn'); if(inp) inp.value='';
  render(); if(!quiet) toast((viaVoice ? 'Heard you. ' : '') + (rep ? 'Added as a recurring task: '+rep.toLowerCase()+'.' : 'Added. lalo is planning it now.'));
}
function parseRepeat(t){
  const s=t.toLowerCase();
  if(!/\b(every|each|daily|weekly|monthly)\b/.test(s)) return null;
  if(/\b(daily|every day|each day|every morning|each morning)\b/.test(s)) return 'Every day at 9am';
  if(/\b(monthly|every month|each month)\b/.test(s)) return 'First of every month';
  const day = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'].find(d=>s.includes(d));
  if(day){ const D=day[0].toUpperCase()+day.slice(1); const lbl='Every '+D+' at 9am'; NEXT[lbl]=D.slice(0,3)+' 9:00am'; return lbl; }
  return 'Every Monday at 9am';
}

function tick(){
  let changed=false;
  const now=Date.now(), starting=upcoming.find(u=>!u.nudged && +u.at<=now && now<+u.at+5*60000);
  if(starting && !ui.rec){ starting.nudged=true; ui.nudge=starting.id; renderNudge(); }
  cards.forEach(k=>{
    if(k.col!=='work' || !k.steps) return;
    const i = k.steps.findIndex(s=>s.st==='doing');
    if(i<0) return;
    k.steps[i].st='done'; changed=true;
    if(k.kind==='stove') slog(k,'step','Step '+(i+1)+' done: '+k.steps[i].t);
    if(k.liveP) k.liveP.chat.push({f:'lalo', t:'Done: '+k.steps[i].t+'.'});
    if(k.kind==='ship'){ const DONE_SUB={3:'All comments fixed, replied on each thread',4:'142 passed, 0 failed',5:'Live on staging, flag off for customers',6:'4 screenshots'}; if(DONE_SUB[i]) k.steps[i].sub=DONE_SUB[i]; }
    let j=i+1;
    while(j<k.steps.length && k.steps[j].st==='done') j++;
    if(j>=k.steps.length){ if(k.liveP) k.liveP.chat.push({f:'lalo', t:'All done.'}); k.col='done'; if(k.repeat && !k.repeat.runs.length) k.repeat.runs.unshift(['Today','First run done, posted to your Notes']); return; }
    if(k.steps[j].who==='ai'){ k.steps[j].st='doing'; }
    else { k.col='need'; }
    if(k.kind==='stove' && k.col==='need' && k.picked==null) slog(k,'lalo','Shortlist ready with discounts applied.');
    if(k.liveP && k.col==='need'){ const y=k.steps.find(x=>x.st!=='done'); k.liveP.chat.push({f:'lalo', t:'Your turn: '+(y?y.t:'take a look')+'. Everything is ready for you.'}); }
  });
  if(changed) render();
}

function tone(k, key, userText){
  const d=k.draft;

  else d.chat.push({f:'me',t:key});
  let to, say;
  if(REPLIES[key]){ [to,say]=REPLIES[key]; }
  else {
    const order=['shorter','direct','warmer','base']; to = order[(order.indexOf(d.cur)+1)%order.length];
    say='Updated with your note. In the real app Claude rewrites it from what you said; this prototype swaps in a preset version.';
  }
  d.cur=to; d.flash=true; d.chat.push({f:'lalo',t:say});
  renderWin(); d.flash=false;
}

  if(e.altKey && (e.code==='Space')){ e.preventDefault(); openPop(); return; }
  if(ui.win && ui.view==='catchup' && !e.target.closest('input,textarea')){ if(e.key==='ArrowRight'){ cuDecide(1); return; } if(e.key==='ArrowLeft'){ cuDecide(-1); return; } }
  if(e.key==='Escape'){ if(ui.compose){ ui.compose=false; renderWin(); } else if(ui.win && ui.view==='meetings' && ui.meetOpen && !ui.phone){ ui.meetOpen=false; renderWin(); } else if(ui.win && (ui.view==='today'||ui.view==='home') && ui.tdPanel){ ui.tdPanel=null; tdPanelHTML.last=null; renderWin(); } else if(ui.win && ui.view==='signals' && ui.sigCfg){ ui.sigCfg=false; sigCfgHTML.shown=false; renderWin(); } else if(ui.pop){ ui.pop=false; render(); } else if(ui.sel){ ui.sel=null; renderWin(); } else if(ui.win){ ui.win=false; render(); } }
});

function clock(){ const d=new Date(); document.getElementById('clock').textContent = d.toLocaleDateString(undefined,{weekday:'short'})+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
clock(); setInterval(clock, 15000);
/* ---------- light / dark ---------- */
const DARKQ = window.matchMedia('(prefers-color-scheme: dark)');
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==='dark' : DARKQ.matches; }
function paintThemeBtn(){
  const b=document.getElementById('themeBtn'); if(!b) return;
  b.innerHTML = isDark() ? I.sun : I.moon;
  b.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode');
  b.title = b.getAttribute('aria-label');
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('lalo-theme', t); }catch(_){}
  paintThemeBtn(); render();
}
try{ const saved=localStorage.getItem('lalo-theme'); if(saved==='dark'||saved==='light') document.documentElement.dataset.theme=saved; }catch(_){}
try{ DARKQ.addEventListener('change', ()=>{ paintThemeBtn(); render(); }); }catch(_){}
paintThemeBtn();

const PHONE = window.matchMedia('(max-width: 600px)');
function applyPhone(){
  ui.phone = PHONE.matches;
  document.body.classList.toggle('phone', ui.phone);
  if(ui.phone){ ui.pop=false; ui.hinted=true; ui.win=true; if(!ui._phoneInit || ui.view==='today') ui.view='home'; ui._phoneInit=true; }
  else if(ui.view==='home') { ui.view='today'; }
}
applyPhone();
try{ PHONE.addEventListener('change', ()=>{ applyPhone(); render(); }); }catch(_){}
// Links can open a page directly, e.g. ?view=signals (as an existing user). Add &shot=1 to hide prototype-only chrome.
(()=>{ let q; try{ q=new URLSearchParams(location.search); }catch(_){ q=null; }
  const v=q && q.get('view');
  if(v && ['today','board','meetings','signals','insights','profile'].includes(v)){
    setPersona('existing'); ui.win=true; ui.view=(v==='today' && ui.phone) ? 'home' : v; ui.hinted=true;
    if(q.get('shot')) document.body.classList.add('shot');
    render();
  } else setPersona('new');
})();
</script>
